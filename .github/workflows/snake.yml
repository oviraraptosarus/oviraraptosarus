name: Snake Animation

on:
  schedule:
    - cron: "0 12 * * *"   # daily at noon IST (UTC+5:30 → 06:30 UTC)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: oviraraptosarus
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#00ff41&color_dots=#0d1117,#1a3a2a,#1e5c3a,#2ea043,#3fb950

      - name: Push output to dist branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
